<nav class="tabs" data-group="primary">
	{{#each tabs.primary}}
	<a class="item {{cssClass}}" data-tab="{{id}}" data-group="primary">
		<i class="{{icon}}"></i>
		<span>{{label}}</span>
	</a>
	{{/each}}
	{{#if @root.isGM}}<i class="fas {{#if @root.isLinked}}fa-link{{else}}fa-link-slash{{/if}} actor-link-icon{{#if @root.isToken}} readonly{{/if}}" title="{{#if @root.isLinked}}{{localize 'DOLMEN.TokenLinked'}}{{else}}{{localize 'DOLMEN.TokenUnlinked'}}{{/if}}"></i>{{/if}}
	<i class="fas {{#if @root.rollsLocked}}fa-lock{{else}}fa-lock-open{{/if}} roll-lock-icon" title="{{#if @root.rollsLocked}}{{localize 'DOLMEN.RollsLocked'}}{{else}}{{localize 'DOLMEN.RollsUnlocked'}}{{/if}}"></i>
</nav>
